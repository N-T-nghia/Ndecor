<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — NDECOR®</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231E1715'/><rect x='8' y='8' width='16' height='16' fill='%23E8E2D5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Đảm bảo đường dẫn CSS đúng -->
<link rel="stylesheet" href="san-pham/_shared.css">
<style>
/* CSS CỨU HỘ (Fallback) phòng khi _shared.css không load được */
body {
  background-color: #201b16 !important;
  color: #E8E2D5 !important;
}
.hero-list{padding:9rem 2rem 3rem}
.hero-list .kicker{
  font-family:var(--font-mono);font-size:.625rem;letter-spacing:.22em;
  color:#a89f93;display:block;margin-bottom:1.5rem;
}
.hero-list .kicker b{color:#E8E2D5;font-weight:400}
.hero-list h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(2.8rem,11vw,9rem);
  line-height:1.15;letter-spacing:-.02em;text-transform:uppercase;
  margin-bottom:2rem; color: #E8E2D5;
}
.hero-list .intro{
  font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.8;
  color:#a89f93;font-weight:300;max-width:52ch;
}

/* Lưới sản phẩm */
.product-grid{
  padding:4rem 2rem 6rem;
  display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
}
.product-card{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid #2e2822;overflow:hidden;isolation:isolate;
  transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .4s;
  aspect-ratio:4/5;padding:1.5rem;text-decoration:none;
  color: #E8E2D5 !important; /* Ép chữ màu sáng */
}
.product-card:hover{transform:translateY(-8px);border-color:#E8E2D5}
.product-card .thumb{
  position:absolute;inset:0;z-index:-1;
  background-size:cover;background-position:center;
  background-color:#1a1611;
  opacity:.5;transition:opacity .5s,transform .6s;
}
.product-card:hover .thumb{opacity:.8;transform:scale(1.03)}
.product-card .thumb::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(32,27,22,.3) 0%,transparent 40%,rgba(32,27,22,.9) 100%);
}
.product-card .thumb.fallback{
  background:
    radial-gradient(circle at 30% 30%,rgba(232,226,213,.15) 0%,transparent 45%),
    radial-gradient(circle at 70% 70%,rgba(232,226,213,.10) 0%,transparent 40%),
    #1a1611;
}
.product-card .meta{
  display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:.625rem;letter-spacing:.18em;
  color:#E8E2D5;position:relative;z-index:1;
}
.product-card .meta .cat{color:#a89f93}
.product-card .info{position:relative;z-index:1}
.product-card h2{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(1.6rem,3vw,2.4rem);
  line-height:1.15;letter-spacing:-.02em;text-transform:uppercase;
  margin-bottom:.5rem; color: #E8E2D5 !important;
}
.product-card .arr{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.18em;
  color:#a89f93;transition:color .35s,gap .35s;
}
.product-card:hover .arr{color:#E8E2D5;gap:.75rem}

@media(max-width:720px){
  .hero-list{padding:7rem 1.25rem 2rem}
  .product-grid{padding:2rem 1.25rem 4rem;grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<header>
  <a href="ndecor.html" class="back-link" data-hover>
    <span class="arr">←</span><span>NDECOR<sup>®</sup></span>
  </a>
  <div class="head-meta">
    <span>PORTFOLIO — SẢN PHẨM</span>
    <span class="hide-m" id="count-label">— DỰ ÁN</span>
  </div>
</header>

<main>
  <section class="hero-list">
    <span class="kicker" data-reveal><b>01</b> — PORTFOLIO / SẢN PHẨM</span>
    <h1 data-reveal>SẢN PHẨM</h1>
    <p class="intro" data-reveal>
      Tất cả dự án của NDECOR — mỗi không gian là một lần đối thoại giữa vật liệu thô,
      ánh sáng tự nhiên và cách con người chọn sống trong đó.
    </p>
  </section>

  <section class="product-grid" id="product-grid"></section>

  <footer class="foot-meta" style="color: #a89f93; padding: 2rem; font-family: var(--font-mono); font-size: 0.625rem; display: flex; justify-content: space-between; border-top: 1px solid #2e2822;">
    <span>© 2026 NDECOR® STUDIO</span>
    <span>PHƯỜNG BÌNH PHƯỚC, TỈNH ĐỒNG NAI</span>
    <span>MADE WITH OBSESSION</span>
  </footer>
</main>

<!-- Load data từ file tự động sinh -->
<script src="data/products.js"></script>
<script>
(function(){
"use strict";
const products = window.NDECOR_PRODUCTS || [];
const grid = document.getElementById('product-grid');
document.getElementById('count-label').textContent = String(products.length).padStart(2,'0') + ' DỰ ÁN';

if(products.length === 0) {
  grid.innerHTML = '<p style="color:#E8E2D5; padding: 2rem;">Chưa có dữ liệu sản phẩm. Hãy chạy lệnh <code>node scan-products.js</code> để quét thư mục.</p>';
  return;
}

products.forEach(p => {
  // Xử lý an toàn cho ảnh
  const thumbClass = p.image ? 'thumb' : 'thumb fallback';
  const thumbStyle = p.image ? `background-image:url('${p.image.replace(/'/g, "\\'")}')` : '';
  
  // Xử lý an toàn cho tags (nếu không có tag thì hiển thị năm)
  const tagsArr = p.tags && p.tags.length > 0 ? p.tags : [p.year || 'DỰ ÁN'];
  const cat = tagsArr.join(' · ');
  
  // Xử lý an toàn cho titleLines
  const titleHTML = (p.titleLines && p.titleLines.length > 0) ? p.titleLines.join('<br>') : 'CHƯA CÓ TÊN';

  const a = document.createElement('a');
  a.href = 'san-pham/chi-tiet.html?id=' + encodeURIComponent(p.id);
  a.className = 'product-card';
  a.setAttribute('data-hover','');
  a.setAttribute('data-reveal','');
  
  a.innerHTML = `
    <div class="${thumbClass}" style="${thumbStyle}"></div>
    <div class="meta"><span>${p.num} / ${p.year}</span><span class="cat">${cat}</span></div>
    <div class="info">
      <h2>${titleHTML}</h2>
      <span class="arr">XEM DỰ ÁN →</span>
    </div>`;
  grid.appendChild(a);
});
})();
</script>
<script src="san-pham/_shared.js"></script>
</body>
</html>
